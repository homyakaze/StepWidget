name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack and find project
        id: find
        run: |
          if [ -f Shagi-project.zip ]; then
            rm -rf project
            unzip -oq Shagi-project.zip -d project
            DIR=project
            if [ ! -f project/settings.gradle.kts ]; then
              F=$(find project -name settings.gradle.kts | head -1)
              DIR=$(dirname "$F")
            fi
          else
            F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
            DIR=$(dirname "$F")
          fi
          echo "Project dir: $DIR"
          ls -R "$DIR" | head -50
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/StepWidget.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: StepWidget-apk
          path: StepWidget.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StepWidget.apk
